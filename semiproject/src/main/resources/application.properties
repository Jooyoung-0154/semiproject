# Application
spring.application.name=semiproject

# Database
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.jdbc-url=${DB_URL:jdbc:mysql://localhost:3306/cloud?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.hikari.username=${DB_USERNAME:root}
spring.datasource.hikari.password=${DB_PASSWORD}
spring.datasource.hikari.auto-commit=true

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/sql-*.xml

# Logging
logging.level.org.cloud.mapper=debug

# File upload and serving
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${FILE_UPLOAD_DIR:upload/uploads}

# External APIs
api.recipe.key=${RECIPE_API_KEY}
google.gemini.api.key=${GEMINI_API_KEY}
google.gemini.model.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

# View
spring.thymeleaf.check-template-location=false
